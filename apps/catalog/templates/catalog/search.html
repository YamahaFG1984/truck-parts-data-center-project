{% extends "base.html" %}

{% block title %}智能查询 · 卡车配件 AI 产品数据中心{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-1">智能查询</h1>
<p class="text-sm text-slate-500 mb-4">
  输入客户给的 OE 号、互换号、SKU、品名或车型。带横杠、空格、全角都能认出来。
  也可以加前缀限定：<code class="bg-slate-100 px-1 rounded">oe:</code>
  <code class="bg-slate-100 px-1 rounded">sku:</code>
  <code class="bg-slate-100 px-1 rounded">name:</code>
</p>

<form method="get" action="{% url 'catalog:search' %}" class="mb-6" role="search">
  <div class="flex gap-2">
    <input type="search" name="q" value="{{ q }}" autofocus autocomplete="off"
           placeholder="例如 2044-3906、FIT-BPD-00001、brake pad volvo、沃尔沃 刹车片"
           class="flex-1 min-w-0 rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
           hx-get="{% url 'catalog:search' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#results"
           hx-push-url="true"
           hx-indicator="#search-spinner">
    <button type="submit" class="rounded-lg bg-blue-700 px-5 text-white hover:bg-blue-800">查询</button>
  </div>
  <p id="search-spinner" class="htmx-indicator text-xs text-slate-400 mt-1">查询中…</p>
</form>

<div id="results">
  {% include "catalog/partials/search_results.html" %}
</div>
{% endblock %}
