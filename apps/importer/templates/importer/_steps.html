{# include with current=<1..5> #}
<ol class="flex flex-wrap gap-2 text-xs mb-5" aria-label="导入步骤">
  {% for label in steps %}
  <li class="rounded-full px-3 py-1 {% if forloop.counter == current %}bg-blue-700 text-white{% elif forloop.counter < current %}bg-blue-100 text-blue-800{% else %}bg-slate-100 text-slate-400{% endif %}">{{ forloop.counter }} {{ label }}</li>
  {% endfor %}
</ol>
