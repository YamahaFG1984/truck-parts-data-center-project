# Local PostgreSQL only; Django runs on the host.
# Host port defaults to 5432; set POSTGRES_PORT in .env if it is taken.
name: tpdc

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tpdc
      POSTGRES_PASSWORD: tpdc
      POSTGRES_DB: tpdc
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpdc -d tpdc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
